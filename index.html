[['t','bottom'],['b','top']].forEach(([c,dir])=>{const el=$('.pb.'+c);

<script type="module">
import * as THREE from 'three';

/* shared valley maths (JS + GLSL) */
const pathX=z=>9*Math.sin(z*.018)+4*Math.sin(z*.041+1.3);
const hgt=(x,z)=>{const d=x-pathX(z);return Math.min(.03*d*d,40)+1.2*Math.sin(x*.13+z*.07)*Math.sin(z*.11-x*.05)+.6*Math.sin(x*.31+1.7)*Math.cos(z*.27)};
const GL=`float pathX(float z){return 9.*sin(z*.018)+4.*sin(z*.041+1.3);}
float hgt(float x,float z){float d=x-pathX(z);return min(.03*d*d,40.)+1.2*sin(x*.13+z*.07)*sin(z*.11-x*.05)+.6*sin(x*.31+1.7)*cos(z*.27);}
float pool(float x,float z){float p=.5+.5*sin(x*.09+z*.05+sin(z*.031)*2.)*sin(z*.043-x*.07+1.);return pow(clamp(p,0.,1.),1.6);}
float h1(float s){return fract(sin(s*127.1)*43758.5453);}`;

function fallback(leaf){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
 for(let i=0;i<16;i++){x.fillStyle=leaf?`hsl(${130+i*4},50%,40%)`:`hsl(${i*23},80%,65%)`;x.beginPath();x.arc((i%4)*128+64,(i>>2)*128+64,48,0,6.3);x.fill()}return new THREE.CanvasTexture(c)}
const load=(u,leaf)=>new Promise(r=>loader.load(u,t=>r(t),undefined,()=>r(fallback(leaf))));
const prep=t=>{t.colorSpace=THREE.SRGBColorSpace;t.generateMipmaps=true;t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;t.anisotropy=4;t.needsUpdate=true;return t};

/* flowers + leaves (GPU points) */
const ptVert=`${GL}uniform float uTime,uCamZ,uHover,uAspect,uPS,uLeaf;uniform vec2 uMouse;attribute float aCell;
varying float vCell,vRot,vBright,vGlow,vD,vBlur,vTilt;
void main(){float seed=position.z,z=position.y;z+=floor((uCamZ+30.-z)/250.)*250.;
 float x=pathX(z)+position.x,r=h1(seed*91.7);bool lf=uLeaf>.5;
 float lift=lf?.05+r*.25:.18+r*1.05;float sw=sin(uTime*.8+seed*60.+z*.2)*.06*lift*(lf?1.:2.);
 vec3 p=vec3(x+sw,hgt(x,z)+lift,z+sw*.5);
 if(!lf){float q=h1(seed*37.1);p.y+=uHover*(1.5+q*6.);p.x+=uHover*sin(uTime*.35+seed*50.)*1.6;p.z+=uHover*cos(uTime*.3+seed*40.)*1.6;}
 vec4 mv=viewMatrix*vec4(p,1.);vec4 cp=projectionMatrix*mv;
 vec2 nd=cp.xy/cp.w,dm=nd-uMouse;dm.x*=uAspect;float d2=dot(dm,dm);vec2 dir=dm/(sqrt(d2)+1e-4);dir.x/=uAspect;
 cp.xy+=dir*exp(-d2/.06)*.26*cp.w;vGlow=exp(-d2/.022)*step(0.,cp.w);
 float depth=-mv.z;vD=depth;
 gl_PointSize=clamp((lf?.6+r*.5:(.8+r*.5)*(1.+uHover*.8))*uPS/max(depth,.1),1.,lf?420.:640.);
 gl_Position=cp;vCell=aCell;vRot=lf?(r-.5)*.9:h1(seed*13.3)*6.2832;
 vBright=(.9+.45*pool(x,z))*(.88+.24*h1(seed*3.3));vTilt=lf?1.:.72+.28*h1(seed*5.9);
 vBlur=clamp(smoothstep(4.,.6,depth)*2.2+smoothstep(80.,200.,depth)*.6+(lf?0.:uHover*3.),0.,6.5);}`;
const ptFrag=`uniform sampler2D map;uniform float uLeaf,uHover;varying float vCell,vRot,vBright,vGlow,vD,vBlur,vTilt;
void main(){bool lf=uLeaf>.5;vec2 c=gl_PointCoord-.5;float ca=cos(vRot),sa=sin(vRot);c=mat2(ca,-sa,sa,ca)*c*(lf?1.05:1.3);c.y/=vTilt;
 if(max(abs(c.x),abs(c.y))>.5)discard;vec2 pc=c+.5,cell=vec2(mod(vCell,4.),floor(vCell/4.));
 vec2 uv=vec2((cell.x+.03+pc.x*.94)/4.,1.-(cell.y+.03+pc.y*.94)/4.);
 vec4 t=texture2D(map,uv,vBlur);t.rgb/=max(t.a,.02);
 if(t.a<mix(.5,.05,vBlur/6.5))discard;
 vec3 col=t.rgb;
 if(lf){float l=dot(col,vec3(.299,.587,.114));col=mix(col,vec3(l),.25)*vec3(.7,.95,.8)*.5;col+=vGlow*t.rgb*.5;}
 else{col*=vBright*(.78+.22*vTilt)*(1.+uHover*.5);col+=vGlow*(t.rgb*.45);}
 col*=exp(-vD*.004);gl_FragColor=vec4(col,1.);}`;
function points(n,leaf,tex){const g=new THREE.BufferGeometry(),a=new Float32Array(n*3),c=new Float32Array(n);
 for(let i=0;i<n;i++){const s=(Math.random()<.5?-1:1)*Math.pow(Math.random(),leaf?1.5:1.7)*(leaf?34:27);a[i*3]=s;a[i*3+1]=Math.random()*250;a[i*3+2]=Math.random();c[i]=Math.floor(Math.random()*16)}
 g.setAttribute('position',new THREE.BufferAttribute(a,3));g.setAttribute('aCell',new THREE.BufferAttribute(c,1));
 const m=new THREE.ShaderMaterial({uniforms:{...U,map:{value:tex},uLeaf:{value:leaf?1:0}},vertexShader:ptVert,fragmentShader:ptFrag});
 const p=new THREE.Points(g,m);p.frustumCulled=false;scene.add(p);return a}

/* grass */
const bp=[];for(let i=0;i<5;i++){const t=i/5;bp.push(-1,t,0,1,t,0)}bp.push(0,1,0);
const bIdx=[0,1,2,1,3,2,2,3,4,3,5,4,4,5,6,5,7,6,6,7,8,7,9,8,8,9,10];
const gVert=`${GL}uniform float uTime,uCamZ,uWrap,uAspect,uWid,uBackup;uniform vec2 uMouse;uniform vec3 uRight,uFwd;attribute vec4 iD;varying float vT,vP,vG,vD;
void main(){float sd=iD.z,t=position.y,ht=iD.w;float z=iD.y;z+=floor((uCamZ+6.-z)/uWrap)*uWrap;
 float x=pathX(z)+iD.x,hy=hgt(x,z);vec3 p=vec3(x,hy,z);
 float gust=sin(x*.09+z*.06+uTime*.35)+.5*sin(x*.21-z*.14+uTime*.35+1.7),fl=sin(uTime*3.+sd*80.+x*.5);
 float bend=(gust*.3+fl*.06)*t*t*ht;float yaw=h1(sd*3.1)*6.2832;vec2 sdv=vec2(cos(yaw),sin(yaw));
 float w=(.016+.01*h1(sd*7.7))*(1.-t*.85)*uWid;
 p.xz+=sdv*position.x*w;p.y+=t*ht*(1.-.12*abs(gust)*t);p.x+=bend;p.z+=bend*.5*sin(sd*9.);
 vec4 bc=projectionMatrix*viewMatrix*vec4(x,hy+ht*.5,z,1.);vec2 nd=bc.xy/bc.w,dm=nd-uMouse;dm.x*=uAspect;float d2=dot(dm,dm);
 float g=exp(-d2/.05)*step(0.,bc.w);vec2 dr=dm/(sqrt(d2)+1e-4);
 p+=(uRight*dr.x+uFwd*dr.y)*g*t*t*ht*2.2;p.y-=g*t*t*ht*.25;vG=exp(-d2/.03)*t*step(0.,bc.w);
 vec4 mv=viewMatrix*vec4(p,1.);vD=-mv.z;gl_Position=projectionMatrix*mv;vT=t;vP=pool(x,z);}`;
const gFrag=`varying float vT,vP,vG,vD;void main(){vec3 c=mix(vec3(.004,.02,.012),vec3(.04,.25,.12),smoothstep(0.,.5,vT));c=mix(c,vec3(.3,.62,.38),smoothstep(.4,1.,vT));
 c*=.5+1.6*vP;c+=vec3(.16,.14,.3)*pow(vT,3.)*.4;c+=vec3(.25,1.,.7)*vG*.6;
 c=mix(vec3(.001,.003,.005)+c*0.,c,exp(-vD*.011));gl_FragColor=vec4(c,1.);}`;
function grass(n,wrap,wide,h0,h1_,wid){const g=new THREE.InstancedBufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(bp,3));g.setIndex(bIdx);
 const d=new Float32Array(n*4);for(let i=0;i<n;i++){d[i*4]=(Math.random()-.5)*wide;d[i*4+1]=Math.random()*wrap;d[i*4+2]=Math.random();d[i*4+3]=h0+Math.random()*(h1_-h0)}
 g.setAttribute('iD',new THREE.InstancedBufferAttribute(d,4));g.instanceCount=n;
 const m=new THREE.ShaderMaterial({uniforms:{...U,uWrap:{value:wrap},uWid:{value:wid}},vertexShader:gVert,fragmentShader:gFrag,side:THREE.DoubleSide});
 const o=new THREE.Mesh(g,m);o.frustumCulled=false;scene.add(o)}
function stems(a){const g=new THREE.InstancedBufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(bp,3));g.setIndex(bIdx);
 g.setAttribute('iS',new THREE.InstancedBufferAttribute(a,3));g.instanceCount=a.length/3;
 const m=new THREE.ShaderMaterial({uniforms:{...U},side:THREE.DoubleSide,
 vertexShader:`${GL}uniform float uTime,uCamZ,uHover;attribute vec3 iS;varying float vT,vP,vD;
 void main(){float seed=iS.z,t=position.y,z=iS.y;z+=floor((uCamZ+30.-z)/250.)*250.;float x=pathX(z)+iS.x;
  float lift=.18+h1(seed*91.7)*1.05,sw=sin(uTime*.8+seed*60.+z*.2)*.06*lift*2.;
  vec3 p=vec3(x,hgt(x,z),z);float w=.016*(1.-t*.5)*(1.-uHover);float yaw=h1(seed*3.7)*3.1416;
  p.xz+=vec2(cos(yaw),sin(yaw))*position.x*w;p.y+=t*lift;p.x+=sw*t*t;p.z+=sw*.5*t*t;
  vec4 mv=viewMatrix*vec4(p,1.);vD=-mv.z;gl_Position=projectionMatrix*mv;vT=t;vP=pool(x,z);}`,
 fragmentShader:`varying float vT,vP,vD;void main(){vec3 c=mix(vec3(.03,.12,.04),vec3(.1,.3,.1),vT)*(.7+.7*vP);c*=exp(-vD*.004);gl_FragColor=vec4(c,1.);}`});
 const o=new THREE.Mesh(g,m);o.frustumCulled=false;scene.add(o)}
grass(mobile?60000:150000,64,26,.22,.62,1.15);grass(mobile?22000:55000,210,34,.4,1,2.2);

/* dust motes */
{const n=2200,a=new Float32Array(n*3),s=new Float32Array(n);for(let i=0;i<n;i++){a[i*3]=Math.random()*200;a[i*3+1]=Math.random()*200;a[i*3+2]=Math.random()*200;s[i]=Math.random()}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));g.setAttribute('aS',new THREE.BufferAttribute(s,1));
 const m=new THREE.ShaderMaterial({uniforms:{uTime:U.uTime,uPS:U.uPS,uCam:U.uCam},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`uniform float uTime,uPS;uniform vec3 uCam;attribute float aS;varying float vA;void main(){vec3 q=position+vec3(sin(uTime*.1+aS*20.),cos(uTime*.13+aS*30.)*.5,sin(uTime*.08+aS*10.))*2.;
   vec3 r=mod(q-uCam,vec3(44.,14.,60.))-vec3(22.,5.,45.);vec4 mv=viewMatrix*vec4(uCam+r,1.);gl_Position=projectionMatrix*mv;
   gl_PointSize=clamp(.05*uPS/max(-mv.z,.1),1.,7.);vA=(.35+.65*(.5+.5*sin(uTime*2.+aS*50.)))*smoothstep(48.,20.,-mv.z);}`,
  fragmentShader:`varying float vA;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(1.,.9,.72,smoothstep(.5,0.,d)*vA*.8);}`});
 const p=new THREE.Points(g,m);p.frustumCulled=false;scene.add(p)}

/* god rays */
const rc=document.createElement('canvas');rc.width=64;rc.height=4;{const x=rc.getContext('2d'),gr=x.createLinearGradient(0,0,64,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gr;x.fillRect(0,0,64,4)}
const rayTex=new THREE.CanvasTexture(rc),rays=[];
for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(10+i%3*4,60),new THREE.MeshBasicMaterial({map:rayTex,color:0x6f7cff,transparent:true,opacity:.015+(i%4)*.005,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
 m.userData.z=-i*40;m.userData.s=(i%2?1:-1)*(5+i*1.3);m.frustumCulled=false;scene.add(m);rays.push(m)}

/* post */
let W=innerWidth,H=innerHeight;
const composer=new EffectComposer(renderer);composer.setPixelRatio(pr);composer.setSize(W,H);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.1,.3,.9);composer.addPass(bloom);
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},uTime:{value:0},uSpeed:{value:0},uHover:{value:0},uRes:{value:new THREE.Vector2(W*pr,H*pr)}},
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform sampler2D tDiffuse;uniform float uTime,uSpeed,uHover;uniform vec2 uRes;varying vec2 vUv;
 float hs(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
 void main(){vec2 off=(vUv-.5)*(.0007+uSpeed*.0012);vec3 c=vec3(texture2D(tDiffuse,vUv+off).r,texture2D(tDiffuse,vUv).g,texture2D(tDiffuse,vUv-off).b);
  c=max(c-.012,0.);float l=dot(c,vec3(.2126,.7152,.0722));c=mix(vec3(l),c,1.1);c=c/(c+.18)*1.18;c=smoothstep(0.,1.,c);c+=uHover*(vec3(.03,.06,.025)+vec3(.4,.44,.38)*(.05+.25*smoothstep(.3,1.,vUv.y)));
  c+=(hs(vUv*uRes+fract(uTime)*91.)-.5)*.012;
  float d=length((vUv-.5)*vec2(1.1,1.));c*=1.-smoothstep(.34-uSpeed*.08,.95,d)*(.55+uSpeed*.2);gl_FragColor=vec4(c,1.);}`});
composer.addPass(grade);composer.addPass(new OutputPass());

addEventListener('resize',()=>{W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);composer.setSize(W,H);grade.uniforms.uRes.value.set(W*pr,H*pr);U.uAspect.value=W/H});

/* scroll + keys */
let target=0,prog=0;
try{const lenis=new Lenis({infinite:true,syncTouch:true,smoothWheel:true,lerp:.075,wheelMultiplier:.9});window.__lenis=lenis;let ls=lenis.scroll;
 lenis.on('scroll',()=>{const lim=lenis.limit||1;let d=lenis.scroll-ls;if(d>lim/2)d-=lim;else if(d<-lim/2)d+=lim;ls=lenis.scroll;target+=d*.035;pi.style.width=(lenis.scroll/lim*100)+'%'})}catch(e){console.warn('Lenis unavailable',e)}
const pi=document.getElementById('pi');
addEventListener('keydown',e=>{const f=['ArrowDown','ArrowRight','PageDown'].includes(e.key),b=['ArrowUp','ArrowLeft','PageUp'].includes(e.key);if(f||b){e.preventDefault();S.kick+=f?4:-4}});

/* go */
Promise.all([load('flowers.webp',false),load('leaves.webp',true)]).then(([ft,lt])=>{
 const fa=points(mobile?26000:60000,false,prep(ft));prep(lt);stems(fa);
 document.body.classList.add('ready');S.running=true;requestAnimationFrame(frame)});

const t0=performance.now(),right=new THREE.Vector3(),fwd=new THREE.Vector3();
let last=t0/1000,prev=0,spd=0,mxs=0,mys=0,vel=0,sdt=.016;const um=new THREE.Vector2(9,9);
function frame(now){requestAnimationFrame(frame);const t=now/1000,raw=Math.min(.05,Math.max(.001,t-last));last=t;sdt+=(raw-sdt)*.1;const dt=sdt;
 if(window.__lenis)window.__lenis.raf(now);
 S.hover+=(S.hoverT-S.hover)*(1-Math.exp(-dt*2.2));
 if(!S.reduced)target+=dt*2.4*(1-S.hover);
 target+=S.kick;S.kick=0;
 vel+=(((target-prog)*2.2)-vel)*(1-Math.exp(-dt*5));prog+=vel*dt*(S.hoverT?1.6:1);
 spd+=(Math.min(Math.abs(prog-prev)/dt/8,1.5)-spd)*.08;prev=prog;
 const ks=1-Math.exp(-dt*3);mxs+=((S.has?S.mx:0)-mxs)*ks;mys+=((S.has?S.my:0)-mys)*ks;
 const k=Math.min(1,(now-t0)/3400),ease=1-Math.pow(1-k,3);
 const cz=-prog,cx=pathX(cz),cy=hgt(cx,cz)+1.75+14*(1-ease);
 const lz=cz-14,lx=pathX(lz);
 camera.position.set(cx,cy,cz);camera.lookAt(lx+mxs*3,hgt(lx,lz)+1.2+mys*1.5,lz);camera.updateMatrixWorld();
 const e=camera.matrixWorld.elements;right.set(e[0],0,e[2]).normalize();fwd.set(-e[8],0,-e[10]).normalize();
 U.uRight.value.copy(right);U.uFwd.value.copy(fwd);U.uCam.value.set(cx,cy,cz);U.uCamZ.value=cz;U.uTime.value=t;U.uHover.value=S.hover;
 if(S.has){if(um.x>5)um.set(S.mx,S.my);else{const km=1-Math.exp(-dt*16);um.x+=(S.mx-um.x)*km;um.y+=(S.my-um.y)*km}}else um.set(9,9);U.uMouse.value.copy(um);
 U.uPS.value=H*pr*.5*camera.projectionMatrix.elements[5];
 uC.value.set(Math.round(pathX(cz)/1.1818)*1.1818,Math.round((cz-90)/1.25)*1.25);
 rays.forEach(m=>{const z=m.userData.z+Math.floor((cz+30-m.userData.z)/280)*280,x=pathX(z)+m.userData.s;m.position.set(x,hgt(x,z)+22,z);m.rotation.y=Math.atan2(cx-x,cz-z)});
 bloom.strength=.1+.2*S.hover;bloom.radius=.35+.2*S.hover;grade.uniforms.uHover.value=S.hover;grade.uniforms.uTime.value=t;grade.uniforms.uSpeed.value=Math.min(spd,1.2);
 composer.render();window.uiTick&&uiTick(dt)}
}catch(err){console.warn('WebGL unavailable, showing fallback',err);document.body.classList.add('nogl','ready');document.getElementById('gl').remove()}
